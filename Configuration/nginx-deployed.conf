worker_processes 1;
pid "/Users/chaitanyasingh/Downloads/For_Chaitanya/runtime/nginx.pid";
error_log "/Users/chaitanyasingh/Downloads/For_Chaitanya/runtime/logs/error.log" info;
events { worker_connections 256; }
http {
    log_format cn '$time_iso8601 client=$remote_addr "$request" status=$status '
                  'upstream=$upstream_addr upstream_status=$upstream_status';
    access_log "/Users/chaitanyasingh/Downloads/For_Chaitanya/runtime/logs/access.log" cn;
    upstream cn_backends {
        server 10.7.2.89:3001 max_fails=1 fail_timeout=5s;
        server 10.7.6.93:3002 max_fails=1 fail_timeout=5s;
    }
    server {
        listen 8080;
        server_name app.team1.test api.team1.test;
        return 301 https://$host:8443$request_uri;
    }
    server {
        listen 8443 ssl;
        http2 on;
        server_name app.team1.test api.team1.test;
        ssl_certificate "/Users/chaitanyasingh/Downloads/For_Chaitanya/public/edge.crt";
        ssl_certificate_key "/Users/chaitanyasingh/Downloads/For_Chaitanya/runtime/private/edge.key";
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header X-Edge Chaitanya always;
        location / {
            proxy_pass http://cn_backends;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
